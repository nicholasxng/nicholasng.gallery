{{ $gallery := partial "get-gallery.html" . }}
{{ with $gallery }}
  <a class="card bento-card" href="{{ .page.RelPermalink }}" title="Explore {{ .page.Title }} Gallery">
    <div class="card-media-wrapper">
      <img loading="lazy" width="{{ .thumbnail.Width }}" height="{{ .thumbnail.Height }}" src="{{ .thumbnail.RelPermalink }}" style="background-color: {{ .color }}" alt="{{ .page.Title }}" />
      <div class="card-badges-overlay">
        <span class="card-count-badge">
          <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 9a3.75 3.75 0 1 0 0 7.5A3.75 3.75 0 0 0 12 9Z"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M9.344 3.071a49.52 49.52 0 0 1 5.312 0c.967.052 1.83.585 2.332 1.39l.821 1.317c.24.383.645.643 1.11.71.386.054.77.113 1.152.177 1.432.239 2.429 1.493 2.429 2.909V18a3 3 0 0 1-3 3h-15a3 3 0 0 1-3-3V9.574c0-1.416.997-2.67 2.429-2.909.382-.064.766-.123 1.151-.178a1.56 1.56 0 0 0 1.11-.71l.822-1.315a2.75 2.75 0 0 1 2.332-1.391ZM6.75 12.75a5.25 5.25 0 1 1 10.5 0 5.25 5.25 0 0 1-10.5 0Zm12-1.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"/>
          </svg>
          {{ T "photoCount" (.imageCount | lang.FormatNumber 0) }}
        </span>
        <span class="card-arrow-circle" aria-hidden="true">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </span>
      </div>
    </div>
    <div class="card-details">
      <div class="card-header-line">
        <h2 class="card-title">{{ .page.Title }}</h2>
        <span class="card-indicator">VIEW &rarr;</span>
      </div>
      {{ with .page.Params.Description }}
        <p class="card-description">{{ . }}</p>
      {{ end }}
    </div>
  </a>
{{ end }}
