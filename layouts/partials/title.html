{{ if .Title }}
  <hgroup class="page-hgroup">
    <div class="page-eyebrow">
      <a href="{{ .Site.Home.RelPermalink }}" class="breadcrumb-back" title="Back to All Galleries">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
        </svg>
        <span>ALL GALLERIES</span>
      </a>
    </div>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.Description }}
      <p class="page-lead">{{ . }}</p>
    {{ end }}
  </hgroup>
{{ end }}
