<!doctype html>
{{- $theme := .Params.theme }}
<html {{- with $theme }} class="{{ . }}"{{ end }} lang="{{- site.Params.languageCode | default site.Language.Lang | default "en" -}}">


  {{ partial "head.html" . }}
  <body>
    {{ block "header" . }}{{ partial "header.html" . }}{{ end }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ block "footer" . }}{{ partialCached "footer.html" . }}{{ end }}
  </body>
</html>
