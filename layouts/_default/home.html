{{ define "main" }}
  <h1 class="sr-only">{{ .Site.Title }} — Photography Portfolio</h1>
  {{ partial "featured.html" . }}
  <section class="galleries-section">
    <div class="galleries-section-header">
      <span class="section-label">CURATED GALLERIES</span>
      <span class="section-divider"></span>
    </div>
    <div class="galleries">
      {{ range where .Pages "Params.private" "ne" true }}
        {{ partial "album-card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}
